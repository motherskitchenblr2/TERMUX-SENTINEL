# =============================================================================
# Codacy Security Scan Workflow for Termux-Sentinel
# Analyzes Python and Shell scripts for vulnerabilities and code quality issues
# =============================================================================

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 2'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read           # For actions/checkout to fetch code
      security-events: write   # For github/codeql-action/upload-sarif to upload SARIF results
      actions: read            # Required to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          # Optional project token: uses secret if configured, or runs client-side tools if absent
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity for GitHub Code Scanning compatibility
          gh-code-scanning-compat: true
          # Force 0 exit code so SARIF upload always executes and reports to GitHub Security
          max-allowed-issues: 2147483647

      # Normalize SARIF runs and sanitize URIs to comply with GitHub CodeQL requirements
      - name: Normalize SARIF Output
        if: always()
        run: |
          if [ -f results.sarif ]; then
            sudo chmod 666 results.sarif
            python3 -c "
            import json, os

            with open('results.sarif', 'r', encoding='utf-8') as f:
                content = f.read()

            # Encode spaces in URIs to ensure RFC 3986 compliance
            content = content.replace('\"Python Script/', '\"Python%20Script/')
            data = json.loads(content)

            runs = data.get('runs', [])
            if len(runs) > 1:
                all_rules = []
                all_results = []
                all_artifacts = []
                seen_rule_ids = set()

                for r in runs:
                    driver = r.get('tool', {}).get('driver', {})
                    for rule in driver.get('rules', []):
                        rid = rule.get('id')
                        if rid and rid not in seen_rule_ids:
                            seen_rule_ids.add(rid)
                            all_rules.append(rule)
                    all_results.extend(r.get('results', []))
                    all_artifacts.extend(r.get('artifacts', []))

                merged_run = {
                    'tool': {
                        'driver': {
                            'name': 'Codacy Security Analysis',
                            'rules': all_rules
                        }
                    },
                    'results': all_results,
                    'artifacts': all_artifacts
                }
                data['runs'] = [merged_run]

                with open('results.sarif', 'w', encoding='utf-8') as f:
                    json.dump(data, f)
                print(f'Successfully consolidated {len(runs)} SARIF runs into 1 single run with {len(all_results)} findings.')
            "
          fi

      - name: Upload SARIF results file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
